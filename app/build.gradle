plugins {
    alias(libs.plugins.android.application)
}

def ksFile = rootProject.file("release.jks")

def envCode = System.getenv("APP_VERSION_CODE")
def envName = System.getenv("APP_VERSION_NAME")
def verCode = (envCode != null && envCode.trim().isInteger()) ? envCode.trim().toInteger() : 1
def verName = (envName != null && envName.trim().length() > 0) ? envName.trim() : "1.1"

android {
    namespace 'app.dcx.memo'
    compileSdk 34

    defaultConfig {
        applicationId "app.dcx.memo"
        minSdk 24
        targetSdk 34
        // CI 注入 APP_VERSION_CODE / APP_VERSION_NAME；本地构建用兜底值
        versionCode verCode
        versionName verName
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASS") ?: "memo123456"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "memokey"
                keyPassword System.getenv("RELEASE_KEY_PASS") ?: "memo123456"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有 keystore 就签名，没有就退回 debug 签名，保证 CI 永远能出包
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
