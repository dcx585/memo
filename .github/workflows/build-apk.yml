name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          APP_VERSION_NAME: 1.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/memo-v1.${{ github.run_number }}.apk

      - name: Release versioned
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          files: out/memo-v1.${{ github.run_number }}.apk

      - name: Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: out/memo-v1.${{ github.run_number }}.apk
